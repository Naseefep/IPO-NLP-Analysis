name: Research checks
on: [push, pull_request]
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/create_demo.py
      - run: ipo-sentiment --ipos data/demo/ipos.csv --prices data/demo/prices.csv --news data/demo/news.csv --model lm --lm-dictionary data/demo/toy_dictionary.csv --demo --output outputs/ci-demo
